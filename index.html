<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000"><title>F1rstHUD Prototype 0.1E</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}#hud{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transform:scaleX(-1)}#street{font-size:clamp(38px,10vw,82px);font-weight:850;line-height:1.02;max-width:95vw}#block{font-size:clamp(25px,6.5vw,50px);font-weight:760;margin-top:14px;min-height:1.15em}#direction{font-size:clamp(19px,4.5vw,34px);font-weight:800;margin-top:8px;letter-spacing:.06em}#next{font-size:clamp(20px,5vw,39px);font-weight:760;margin-top:46px;max-width:95vw}#status{font-size:clamp(12px,3vw,16px);font-weight:600;margin-top:22px;opacity:.55}#setup{position:fixed;left:10px;right:10px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:7px;justify-content:center;z-index:4}input,button{background:#111;color:#ddd;border:1px solid #666;border-radius:11px;padding:10px;font-size:14px}input{width:205px;min-width:0}#gear{position:fixed;right:8px;top:max(8px,env(safe-area-inset-top));background:transparent;border:0;color:#444;font-size:22px;z-index:5}@media(orientation:landscape){#street{font-size:13vh}#block{font-size:8vh;margin-top:7px}#direction{font-size:5.5vh;margin-top:4px}#next{font-size:5.8vh;margin-top:24px}#status{margin-top:12px}}</style></head>
<body><div id="hud"><div id="street">READY</div><div id="block">LIVE LOCATION</div><div id="direction">—</div><div id="next">NEXT: —</div><div id="status">0.1E • SPECIALIST ENGINES</div></div><div id="setup"><input id="token" placeholder="pk. Mapbox public token" autocapitalize="off" autocomplete="off"><button id="start">ENABLE LOCATION</button><button id="mirror">MIRROR</button></div><button id="gear">⚙︎</button>
<script>
const $=id=>document.getElementById(id),hud=$("hud"),setup=$("setup");let watchId=null,mirrored=true,trace=[],course=null,lastQuery=0,lastRoad="",roadCandidate="",roadHits=0,lastDir="",dirCandidate="",dirHits=0,lastBlock="",blockMisses=0,lockedAhead=null;
const saved=localStorage.getItem("mapbox_public_token");if(saved)$("token").value=saved;
function meters(a,b,c,d){const R=6371000,p=Math.PI/180,x=(d-b)*p*Math.cos((a+c)/2*p),y=(c-a)*p;return Math.hypot(x,y)*R}function bearing(a,b,c,d){const p=Math.PI/180,y=Math.sin((d-b)*p)*Math.cos(c*p),x=Math.cos(a*p)*Math.sin(c*p)-Math.sin(a*p)*Math.cos(c*p)*Math.cos((d-b)*p);return(Math.atan2(y,x)/p+360)%360}function dest(lat,lon,deg,m){const R=6371000,d=m/R,q=deg*Math.PI/180,p1=lat*Math.PI/180,l1=lon*Math.PI/180,p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(q)),l2=l1+Math.atan2(Math.sin(q)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));return[l2*180/Math.PI,p2*180/Math.PI]}
function norm(s){return String(s||"").toUpperCase().trim().replace(/\s+/g," ").replace(/\b(WEST|EAST|NORTH|SOUTH)\s+FARM[- ]TO[- ]MARKET(?: ROAD)?\s*(\d+)\b/g,"FM $2").replace(/\bFARM[- ]TO[- ]MARKET(?: ROAD)?\s*(\d+)\b/g,"FM $1").replace(/\bFARM ROAD\s*(\d+)\b/g,"FM $1").replace(/\bCOUNTY ROAD\s*(\d+)\b/g,"CR $1")}
function key(s){return norm(s).replace(/\b(NORTH|SOUTH|EAST|WEST|NB|SB|EB|WB)\b/g,"").replace(/\b(ROAD|RD|STREET|ST|HIGHWAY|HWY|EXPRESSWAY|EXPY|FREEWAY|FWY|FRONTAGE)\b/g,"").replace(/[^A-Z0-9]/g,"")}function same(a,b){let x=key(a),y=key(b);return!!x&&!!y&&(x===y||x.includes(y)||y.includes(x))}
function cardinal(h){if(h==null)return"";h=(h+360)%360;return h>=315||h<45?"NORTH":h<135?"EAST":h<225?"SOUTH":"WEST"}function stableDir(h){let d=cardinal(h);if(!d)return lastDir;if(!lastDir)return lastDir=d;if(d===lastDir){dirCandidate="";dirHits=0;return d}if(d===dirCandidate)dirHits++;else{dirCandidate=d;dirHits=1}if(dirHits>=2){lastDir=d;dirCandidate="";dirHits=0}return lastDir}function distText(m){let ft=m*3.28084;return ft>=2640?(ft/5280).toFixed(1)+" MI":Math.max(50,Math.round(ft/50)*50)+" FT"}
function setRoad(c,conf){c=norm(c);if(!c)return lastRoad;if(!lastRoad)return lastRoad=c;if(c===lastRoad){roadCandidate="";roadHits=0;return c}if(conf>=.8)return lastRoad=c;if(c===roadCandidate)roadHits++;else{roadCandidate=c;roadHits=1}if(roadHits>=2){lastRoad=c;roadCandidate="";roadHits=0}return lastRoad}
async function match(token){if(trace.length<2)return null;let p=trace.slice(-7),coords=p.map(x=>`${x.lon},${x.lat}`).join(";"),ts=p.map(x=>Math.floor(x.time/1000)).join(";"),rad=p.map(x=>Math.min(50,Math.max(8,Math.round(x.acc||15)))).join(";");let r=await fetch(`https://api.mapbox.com/matching/v5/mapbox/driving/${coords}.json?tidy=true&timestamps=${ts}&radiuses=${rad}&overview=false&access_token=${encodeURIComponent(token)}`);if(!r.ok)return null;let j=await r.json(),tp=[...(j.tracepoints||[])].reverse().find(Boolean);if(!tp)return null;let i=tp.matchings_index??0;return{road:norm(tp.name),confidence:j.matchings?.[i]?.confidence??0,location:tp.location}}
async function tilequery(lon,lat,token,layers="road",radius=18,limit=20){let r=await fetch(`https://api.mapbox.com/v4/mapbox.mapbox-streets-v8/tilequery/${lon},${lat}.json?radius=${radius}&limit=${limit}&layers=${layers}&access_token=${encodeURIComponent(token)}`);if(!r.ok)return[];return(await r.json()).features||[]}
async function roadInfo(lat,lon,token,preferred){let f=await tilequery(lon,lat,token,"road",22,20),roads=f.filter(x=>String(x.properties?.tilequery?.geometry||"").toLowerCase()==="linestring"&&x.properties?.name);roads.sort((a,b)=>(a.properties.tilequery.distance||0)-(b.properties.tilequery.distance||0));let pick=roads.find(x=>same(x.properties.name,preferred))||roads[0];return pick?{name:norm(pick.properties.name),class:String(pick.properties.class||""),type:String(pick.properties.type||""),distance:pick.properties.tilequery.distance||0}:null}
function highwayMode(info,road){if(!info)return /\b(US\s*\d+|I-?\s*\d+|INTERSTATE|FREEWAY|TOLLWAY|TURNPIKE)\b/.test(norm(road));return info.class==="motorway"||info.type==="motorway"}function frontageMode(info,road){let s=norm(road);return /FRONTAGE|SERVICE ROAD/.test(s)||(info&&info.class!=="motorway"&&/EXPRESSWAY|FREEWAY/.test(s))}
async function reverseOne(lat,lon,token){let r=await fetch(`https://api.mapbox.com/search/geocode/v6/reverse?longitude=${lon}&latitude=${lat}&country=us&types=address&limit=1&access_token=${encodeURIComponent(token)}`);if(!r.ok)return null;let f=(await r.json()).features?.[0],p=f?.properties||{},c=p.context||{};return{road:norm(c.street?.name||p.name||""),number:String(c.address?.address_number||p.address_number||"")}}
async function blockEngine(lat,lon,heading,token,road,isHwy){if(isHwy)return"";let points=[[lon,lat]];if(heading!=null){points.push(dest(lat,lon,heading+90,25),dest(lat,lon,heading-90,25),dest(lat,lon,heading+90,45),dest(lat,lon,heading-90,45))}let vals=[];for(const p of points){let g=await reverseOne(p[1],p[0],token);if(g&&same(g.road,road)){let m=g.number.match(/\d+/),n=m?+m[0]:NaN;if(Number.isFinite(n)&&n>=100)vals.push(Math.floor(n/100)*100)}}if(vals.length){vals.sort((a,b)=>a-b);let b=vals[Math.floor(vals.length/2)]+" BLOCK";lastBlock=b;blockMisses=0;return b}blockMisses++;return blockMisses<=2?lastBlock:""}
async function routeLine(lat,lon,heading,token){if(heading==null)return[];let e=dest(lat,lon,heading,2200),r=await fetch(`https://api.mapbox.com/directions/v5/mapbox/driving/${lon},${lat};${e[0]},${e[1]}?overview=full&geometries=geojson&steps=false&bearings=${Math.round(heading)},80;&access_token=${encodeURIComponent(token)}`);if(!r.ok)return[];return(await r.json()).routes?.[0]?.geometry?.coordinates||[]}
function sampleLine(coords,maxM=1400,stepM=55){if(coords.length<2)return[];let out=[],walk=0,next=45;for(let i=1;i<coords.length;i++){let a=coords[i-1],b=coords[i],seg=meters(a[1],a[0],b[1],b[0]);while(walk+seg>=next&&next<=maxM){let t=(next-walk)/seg;out.push({lon:a[0]+(b[0]-a[0])*t,lat:a[1]+(b[1]-a[1])*t,d:next});next+=stepM}walk+=seg;if(walk>maxM)break}return out}
async function aheadEngine(lat,lon,heading,token,road,isHwy){let line=await routeLine(lat,lon,heading,token),samples=sampleLine(line,isHwy?3000:1400,isHwy?90:45);if(isHwy){for(let s of samples){let fs=await tilequery(s.lon,s.lat,token,"motorway_junction",28,10),j=fs.find(x=>x.properties?.ref||x.properties?.name);if(j){let ref=String(j.properties.ref||"").trim(),name=norm(j.properties.name||"");return{name:ref?`EXIT ${ref}${name?` • ${name}`:""}`:(name?`EXIT • ${name}`:"EXIT"),d:s.d}}}return null}
for(let s of samples){let fs=await tilequery(s.lon,s.lat,token,"road",14,20),roads=fs.filter(x=>String(x.properties?.tilequery?.geometry||"").toLowerCase()==="linestring"&&x.properties?.name&&!same(x.properties.name,road)&&!["service","path","track","pedestrian"].includes(x.properties.class));roads.sort((a,b)=>(a.properties.tilequery.distance||99)-(b.properties.tilequery.distance||99));let x=roads[0];if(x&&(x.properties.tilequery.distance||99)<=10)return{name:norm(x.properties.name),d:s.d}}return null}
async function refresh(lat,lon,acc){let token=$("token").value.trim();if(!token.startsWith("pk.")){ $("status").textContent="PUBLIC TOKEN NEEDED";return}localStorage.setItem("mapbox_public_token",token);try{let mm=await match(token),ri=await roadInfo(lat,lon,token,mm?.road||lastRoad),rg=(!mm?.road&&!ri?.name)?await reverseOne(lat,lon,token):null,road=setRoad(mm?.road||ri?.name||rg?.road||lastRoad,mm?.confidence??0),hwy=highwayMode(ri,road)&&!frontageMode(ri,road);$("street").textContent=road||"STREET UNKNOWN";$("direction").textContent=stableDir(course)||"—";let block=await blockEngine(lat,lon,course,token,road,hwy);$("block").textContent=hwy?"":(block||"BLOCK —");let fresh=course==null?null:await aheadEngine(lat,lon,course,token,road,hwy);if(fresh)lockedAhead={...fresh,time:Date.now(),road};else if(lockedAhead&&(Date.now()-lockedAhead.time>12000||lockedAhead.road!==road))lockedAhead=null;$("next").textContent=course==null?"NEXT: START MOVING":lockedAhead?`NEXT: ${lockedAhead.name} • ${distText(lockedAhead.d)}`:(hwy?"NEXT EXIT: —":"NEXT: —");let mode=hwy?"HWY":frontageMode(ri,road)?"FRONTAGE":"ROAD",mt=mm?` • MATCH ${Math.round(mm.confidence*100)}%`:"";$("status").textContent=`LIVE • GPS ±${Math.round(acc*3.28084)} FT${mt} • ${mode} • 0.1E`;setup.style.display="none"}catch(e){console.error(e);$("status").textContent="LOOKUP ISSUE • 0.1E"}}
$("start").onclick=()=>{if(!navigator.geolocation){$("status").textContent="GPS NOT AVAILABLE";return}if(watchId!==null)navigator.geolocation.clearWatch(watchId);$("status").textContent="REQUESTING LOCATION…";watchId=navigator.geolocation.watchPosition(pos=>{let c=pos.coords,pt={lat:c.latitude,lon:c.longitude,acc:c.accuracy,time:Date.now()};if(c.heading!=null&&!Number.isNaN(c.heading)&&(c.speed==null||c.speed>.8))course=c.heading;let prev=trace[trace.length-1];if(!prev||meters(prev.lat,prev.lon,pt.lat,pt.lon)>5){trace.push(pt);if(trace.length>8)trace.shift()}if(course==null&&trace.length>=2){let a=trace[0],z=trace[trace.length-1];if(meters(a.lat,a.lon,z.lat,z.lon)>12)course=bearing(a.lat,a.lon,z.lat,z.lon)}let now=Date.now();if(now-lastQuery>=5000){lastQuery=now;refresh(pt.lat,pt.lon,c.accuracy)}},err=>{$("status").textContent=err.code===1?"LOCATION DENIED":"GPS ERROR"},{enableHighAccuracy:true,maximumAge:1000,timeout:15000})};$("mirror").onclick=()=>{mirrored=!mirrored;hud.style.transform=mirrored?"scaleX(-1)":"none"};$("gear").onclick=()=>setup.style.display="flex";
</script></body></html>
