<script>
"use strict";

/* ==========================================================================
   0. Lab parameters — experimental, unchanged from 0.1
   ========================================================================== */
const DEFAULTS = {
  zoom:              15,
  lruMax:            64,
  stitchTol:         0.5,
  snapMaxDist:       60,
  wOffset:           1.0,
  wBearing:          0.6,
  servicePenalty:    25,
  continuityBonus:   30,
  connectedBonus:    15,
  contAngle:         50,
  aliasAngle:        20,
  chainMaxLen:       2000,
  junctionRadius:    60,
  dedupeStation:     5,
  onRoadOffset:      12,
  offRoadOffset:     28,
  onRoadBearing:     45,
  onRoadNeeded:      3,
  offRoadNeeded:     4,
  minSpeedCourse:    0.8,
  canvasRange:       400
};
let P = Object.assign({}, DEFAULTS);
let EXCLUDED = ["service","driveway","parking_aisle","path","track","steps",
                "pedestrian","construction","ferry","aerialway","golf","rail"];

/* ==========================================================================
   1. MVT decoder

   FIXED IN 0.1.1 — the 0.1 decoder computed length-delimited block ends as
   `const end = p.pos + p.varint()`. JavaScript reads the left operand before
   evaluating the right, so `end` was short by the width of the length varint
   itself. Every block terminated early, the position landed mid-data, and the
   next byte read as a tag produced the impossible "wire type 7". Same slip in
   `this.pos += this.varint()`. Every length is now read into a variable first.
   ========================================================================== */
class PBF {
  constructor(buf){ this.b=buf; this.pos=0; this.len=buf.length; }
  varint(){
    let r=0,s=1,b,guard=0;
    do{
      if(this.pos>=this.len) throw new Error("varint past end of buffer");
      b=this.b[this.pos++]; r+=(b&0x7f)*s; s*=128;
      if(++guard>10) throw new Error("varint too long");
    }while(b>=0x80);
    return r;
  }
  svarint(){ const n=this.varint(); return n%2 ? -(n+1)/2 : n/2; }
  str(){ const n=this.varint(); const s=DEC.decode(this.b.subarray(this.pos,this.pos+n)); this.pos+=n; return s; }
  skip(wt){
    if(wt===0){ let b,g=0; do{ b=this.b[this.pos++]; if(++g>10) throw new Error("bad varint in skip"); }while(b>=0x80); }
    else if(wt===2){ const n=this.varint(); this.pos+=n; }   // FIX: length read first
    else if(wt===5){ this.pos+=4; }
    else if(wt===1){ this.pos+=8; }
    else throw new Error("unsupported wire type "+wt);
  }
  f32(){ const v=new DataView(this.b.buffer,this.b.byteOffset+this.pos,4).getFloat32(0,true); this.pos+=4; return v; }
  f64(){ const v=new DataView(this.b.buffer,this.b.byteOffset+this.pos,8).getFloat64(0,true); this.pos+=8; return v; }
}
const DEC=new TextDecoder("utf-8");

function readValue(p,end){
  let v=null;
  while(p.pos<end){
    const t=p.varint(), f=t>>3, wt=t&7;
    if(f===1&&wt===2)      v=p.str();
    else if(f===2&&wt===5) v=p.f32();
    else if(f===3&&wt===1) v=p.f64();
    else if(f===4&&wt===0) v=p.varint();
    else if(f===5&&wt===0) v=p.varint();
    else if(f===6&&wt===0) v=p.svarint();
    else if(f===7&&wt===0) v=p.varint()!==0;
    else p.skip(wt);
  }
  p.pos=end;
  return v;
}

function decodeTile(buf){
  const p=new PBF(buf), layers={};
  while(p.pos<p.len){
    const tag=p.varint(), f=tag>>3, wt=tag&7;
    if(f===3&&wt===2){
      const n=p.varint();                 // FIX: length into a variable first
      const start=p.pos, end=start+n;
      try{
        const L=readLayerHeader(p,end);
        if(L&&L.name) layers[L.name]=parseFeatures(p.b,L);
      }catch(e){
        log("layer decode failed: "+e.message);
      }
      p.pos=end;                          // always resynchronise
    } else {
      p.skip(wt);
    }
  }
  return layers;
}

function readLayerHeader(p,end){
  const L={name:"",extent:4096,keys:[],values:[],feats:[]};
  while(p.pos<end){
    const t=p.varint(), f=t>>3, wt=t&7;
    if(f===1&&wt===2)      L.name=p.str();
    else if(f===2&&wt===2){ const n=p.varint(); L.feats.push([p.pos,p.pos+n]); p.pos+=n; }
    else if(f===3&&wt===2)  L.keys.push(p.str());
    else if(f===4&&wt===2){ const n=p.varint(); const e2=p.pos+n; L.values.push(readValue(p,e2)); }
    else if(f===5&&wt===0)  L.extent=p.varint();
    else p.skip(wt);
  }
  return L;
}

function parseFeatures(buf,L){
  const out={name:L.name,extent:L.extent,features:[]};
  for(const [s,e] of L.feats){
    const p=new PBF(buf); p.pos=s;
    let id=null,tags=[],type=0,geomRaw=null;
    try{
      while(p.pos<e){
        const t=p.varint(), f=t>>3, wt=t&7;
        if(f===1&&wt===0) id=p.varint();
        else if(f===2&&wt===2){ const n=p.varint(); const end=p.pos+n;   // FIX
                                while(p.pos<end) tags.push(p.varint()); p.pos=end; }
        else if(f===2&&wt===0) tags.push(p.varint());
        else if(f===3&&wt===0) type=p.varint();
        else if(f===4&&wt===2){ const n=p.varint(); const end=p.pos+n;   // FIX
                                const a=[]; while(p.pos<end) a.push(p.varint());
                                p.pos=end; geomRaw=a; }
        else p.skip(wt);
      }
    }catch(err){ continue; }   // drop the single bad feature, keep the layer
    const props={};
    for(let i=0;i+1<tags.length;i+=2){
      const k=L.keys[tags[i]];
      if(k!==undefined) props[k]=L.values[tags[i+1]];
    }
    out.features.push({id,type,props,geom:decodeGeom(geomRaw||[])});
  }
  return out;
}

function decodeGeom(a){
  const zz = n => (n>>1) ^ (-(n&1));
  const lines=[]; let cur=null,x=0,y=0,i=0;
  while(i<a.length){
    const cmd=a[i++], op=cmd&7, count=cmd>>3;
    if(op===1){                                  // MoveTo
      for(let c=0;c<count;c++){
        x+=zz(a[i++]); y+=zz(a[i++]);
        // FIX: was `cur.length>1`, which discarded every point of a multipoint
        // feature except the last. That would have silently dropped
        // motorway_junction points.
        if(cur&&cur.length>=1) lines.push(cur);
        cur=[[x,y]];
      }
    } else if(op===2){                           // LineTo
      for(let c=0;c<count;c++){ x+=zz(a[i++]); y+=zz(a[i++]); if(cur) cur.push([x,y]); }
    } else if(op===7){                           // ClosePath — polygons unused
      if(cur&&cur.length>1) cur.push(cur[0].slice());
    }
  }
  if(cur&&cur.length>=1) lines.push(cur);
  return lines;
}

/* -- decoder self-test: a hand-built tile with one known linestring --------- */
function selfTestDecoder(){
  // Layer "road", extent 4096, one LINESTRING (10,10)->(50,10)->(50,90),
  // props {class:"street", name:"TEST ST"}
  const b=[];
  const varint=v=>{ while(v>=0x80){ b.push((v&0x7f)|0x80); v=Math.floor(v/128); } b.push(v); };
  const sub=[];
  const put=(arr,v)=>{ while(v>=0x80){ arr.push((v&0x7f)|0x80); v=Math.floor(v/128); } arr.push(v); };
  const str=(arr,s)=>{ const u=new TextEncoder().encode(s); put(arr,u.length); for(const c of u) arr.push(c); };
  // name
  sub.push(0x0a); str(sub,"road");
  // feature
  const feat=[];
  feat.push(0x08); put(feat,1);                       // id = 1
  const tags=[0,0,1,1];
  feat.push(0x12); put(feat,tags.length); for(const t of tags) put(feat,t);
  feat.push(0x18); put(feat,2);                       // type = LINESTRING
  const zz=v=>v<0?(-v*2-1):v*2;
  const g=[(1<<3)|1, zz(10), zz(10), (2<<3)|2, zz(40), zz(0), zz(0), zz(80)];
  feat.push(0x22); put(feat,g.length); for(const v of g) put(feat,v);
  sub.push(0x12); put(sub,feat.length); for(const v of feat) sub.push(v);
  // keys
  sub.push(0x1a); str(sub,"class");
  sub.push(0x1a); str(sub,"name");
  // values
  const v1=[]; v1.push(0x0a); str(v1,"street");
  sub.push(0x22); put(sub,v1.length); for(const v of v1) sub.push(v);
  const v2=[]; v2.push(0x0a); str(v2,"TEST ST");
  sub.push(0x22); put(sub,v2.length); for(const v of v2) sub.push(v);
  // extent + version
  sub.push(0x28); put(sub,4096);
  sub.push(0x78); put(sub,2);
  // wrap as tile field 3
  b.push(0x1a); varint(sub.length); for(const v of sub) b.push(v);

  try{
    const L=decodeTile(new Uint8Array(b));
    const r=L.road;
    if(!r) return "FAIL: no road layer";
    if(r.features.length!==1) return "FAIL: "+r.features.length+" features, expected 1";
    const f=r.features[0];
    if(f.props.name!=="TEST ST") return "FAIL: name = "+JSON.stringify(f.props.name);
    if(f.props.class!=="street") return "FAIL: class = "+JSON.stringify(f.props.class);
    const pts=f.geom[0];
    if(!pts||pts.length!==3) return "FAIL: "+(pts?pts.length:0)+" points, expected 3";
    const want=[[10,10],[50,10],[50,90]];
    for(let i=0;i<3;i++) if(pts[i][0]!==want[i][0]||pts[i][1]!==want[i][1])
      return "FAIL: point "+i+" = "+JSON.stringify(pts[i]);
    return "PASS — layer, props, and geometry all decoded correctly";
  }catch(e){ return "FAIL: threw "+e.message; }
}

/* ==========================================================================
   2. Projection
   ========================================================================== */
let ORIGIN=null, MPD_LAT=0, MPD_LON=0;
function setOrigin(lat,lon){
  const f=lat*Math.PI/180;
  MPD_LAT = 111132.92 - 559.82*Math.cos(2*f) + 1.175*Math.cos(4*f);
  MPD_LON = 111412.84*Math.cos(f) - 93.5*Math.cos(3*f);
  ORIGIN={lat,lon};
}
const toXY = (lat,lon)=>[ (lon-ORIGIN.lon)*MPD_LON, (lat-ORIGIN.lat)*MPD_LAT ];
function tilePointToLL(tx,ty,z,px,py,extent){
  const n=Math.pow(2,z);
  const lon=((tx+px/extent)/n)*360-180;
  const q=Math.PI-2*Math.PI*(ty+py/extent)/n;
  const lat=180/Math.PI*Math.atan(0.5*(Math.exp(q)-Math.exp(-q)));
  return [lat,lon];
}
const lon2tx=(lon,z)=>Math.floor((lon+180)/360*Math.pow(2,z));
const lat2ty=(lat,z)=>{ const f=lat*Math.PI/180;
  return Math.floor((1-Math.log(Math.tan(f)+1/Math.cos(f))/Math.PI)/2*Math.pow(2,z)); };

/* ==========================================================================
   3. Plane geometry
   ========================================================================== */
const brg = (dx,dy)=>(Math.atan2(dx,dy)*180/Math.PI+360)%360;
const angDiff = (a,b)=>((a-b+540)%360)-180;
const absDiff = (a,b)=>Math.abs(angDiff(a,b));
function projToSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  let t = L2>0 ? ((px-ax)*dx+(py-ay)*dy)/L2 : 0;
  t=Math.max(0,Math.min(1,t));
  const qx=ax+dx*t, qy=ay+dy*t;
  return {t,qx,qy,d:Math.hypot(px-qx,py-qy)};
}
function segCross(a,b,c,d){
  const r=[b[0]-a[0],b[1]-a[1]], s=[d[0]-c[0],d[1]-c[1]];
  const den=r[0]*s[1]-r[1]*s[0];
  if(Math.abs(den)<1e-12) return null;
  const t=((c[0]-a[0])*s[1]-(c[1]-a[1])*s[0])/den;
  const u=((c[0]-a[0])*r[1]-(c[1]-a[1])*r[0])/den;
  if(t<0||t>1||u<0||u>1) return null;
  return {x:a[0]+r[0]*t, y:a[1]+r[1]*t, t, u};
}

/* ==========================================================================
   4. Tile cache + counters
   ========================================================================== */
const TILES=new Map();
const CTR={net:0,tile:0,hit:0,miss:0,fail:0,startedAt:0,bytes:0};
function lruGet(k){ if(!TILES.has(k)) return null; const v=TILES.get(k); TILES.delete(k); TILES.set(k,v); return v; }
function lruPut(k,v){ if(TILES.has(k)) TILES.delete(k); TILES.set(k,v);
  while(TILES.size>P.lruMax) TILES.delete(TILES.keys().next().value); }

const inflight=new Map();
let LOGGED_LAYERS=false;
async function getTile(z,x,y){
  const k=z+"/"+x+"/"+y;
  const hit=lruGet(k); if(hit){ CTR.hit++; return hit; }
  if(inflight.has(k)) return inflight.get(k);
  CTR.miss++;
  const tok=document.getElementById("token").value.trim();
  const url=`https://api.mapbox.com/v4/mapbox.mapbox-streets-v8/${z}/${x}/${y}.vector.pbf?access_token=${encodeURIComponent(tok)}`;
  const pr=(async()=>{
    CTR.net++; CTR.tile++;
    try{
      const r=await fetch(url);
      if(r.status===404){ const e={__empty:true}; lruPut(k,e); return e; }
      if(!r.ok){ CTR.fail++; log("tile "+k+" HTTP "+r.status+(r.status===401?" (token)":r.status===429?" (rate limit)":"")); return {__empty:true}; }
      const buf=new Uint8Array(await r.arrayBuffer());
      CTR.bytes+=buf.length;
      const layers=decodeTile(buf);
      if(!LOGGED_LAYERS){
        LOGGED_LAYERS=true;
        const names=Object.keys(layers);
        log("first tile "+k+": "+buf.length+" bytes, layers = "+(names.join(", ")||"NONE"));
        if(layers.road) log("  road layer: "+layers.road.features.length+" features, extent "+layers.road.extent);
      }
      lruPut(k,layers);
      return layers;
    }catch(e){ CTR.fail++; log("tile "+k+" decode error: "+e.message); return {__empty:true}; }
    finally{ inflight.delete(k); }
  })();
  inflight.set(k,pr);
  return pr;
}

/* ==========================================================================
   5. Graph construction
   ========================================================================== */
let GRAPH=null, GRAPH_KEY="";
const INSPECT={layers:{},cls:{},type:{},structure:{},layer:{},oneway:{},sample:null,jsample:null};
function tally(o,v){ const k=String(v); o[k]=(o[k]||0)+1; }

async function ensureGraph(lat,lon,force){
  const z=P.zoom|0, tx=lon2tx(lon,z), ty=lat2ty(lat,z), R=1;
  const keys=[];
  for(let dx=-R;dx<=R;dx++) for(let dy=-R;dy<=R;dy++) keys.push([z,tx+dx,ty+dy]);
  const label=keys.map(k=>k.join("/")).sort().join(",");
  if(!force && label===GRAPH_KEY && GRAPH) return GRAPH;
  const tiles=await Promise.all(keys.map(k=>getTile(k[0],k[1],k[2])));
  GRAPH=buildGraph(keys,tiles);
  GRAPH_KEY=label;
  log("graph rebuilt: "+GRAPH.edges.length+" edges, "+GRAPH.nodes.length+" nodes, "+GRAPH.junctions.length+" junctions");
  return GRAPH;
}

function buildGraph(keys,tiles){
  const edges=[], nodes=[], junctions=[];
  const cellSize=P.stitchTol, nodeCells=new Map(), seen=new Set();

  function nodeAt(x,y){
    const ci=Math.round(x/cellSize), cj=Math.round(y/cellSize);
    for(let a=-1;a<=1;a++) for(let b=-1;b<=1;b++){
      const arr=nodeCells.get((ci+a)+":"+(cj+b));
      if(!arr) continue;
      for(const id of arr) if(Math.hypot(nodes[id].x-x,nodes[id].y-y)<=cellSize) return id;
    }
    const id=nodes.length;
    nodes.push({x,y,edges:[]});
    const key=ci+":"+cj;
    if(!nodeCells.has(key)) nodeCells.set(key,[]);
    nodeCells.get(key).push(id);
    return id;
  }

  for(let i=0;i<keys.length;i++){
    const [tz,tx,ty]=keys[i], layers=tiles[i];
    if(!layers||layers.__empty) continue;
    for(const n of Object.keys(layers)) tally(INSPECT.layers,n);

    const road=layers.road;
    if(road) for(const f of road.features){
      if(f.type!==2) continue;
      const p=f.props||{};
      tally(INSPECT.cls,p.class); tally(INSPECT.type,p.type);
      tally(INSPECT.structure,p.structure); tally(INSPECT.layer,p.layer);
      tally(INSPECT.oneway,p.oneway);
      if(!INSPECT.sample) INSPECT.sample=p;
      for(const line of f.geom){
        if(line.length<2) continue;
        const pts=line.map(([gx,gy])=>{
          const [la,lo]=tilePointToLL(tx,ty,tz,gx,gy,road.extent);
          return toXY(la,lo);
        });
        let len=0; const cum=[0];
        for(let k=1;k<pts.length;k++){ len+=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]); cum.push(len); }
        if(len<1) continue;
        const r1=v=>Math.round(v);
        const dk=[p.class,p.name||"",r1(pts[0][0]),r1(pts[0][1]),
                  r1(pts[pts.length-1][0]),r1(pts[pts.length-1][1]),r1(len)].join("|");
        if(seen.has(dk)) continue;
        seen.add(dk);
        const e={
          id:edges.length, pts, cum, len,
          name:String(p.name||""), ref:String(p.ref||""),
          cls:String(p.class||"").toLowerCase(), type:String(p.type||"").toLowerCase(),
          structure:String(p.structure||"none").toLowerCase(),
          layer:Number.isFinite(+p.layer)?+p.layer:0,
          oneway:String(p.oneway||"false").toLowerCase()==="true"
        };
        e.n0=nodeAt(pts[0][0],pts[0][1]);
        e.n1=nodeAt(pts[pts.length-1][0],pts[pts.length-1][1]);
        nodes[e.n0].edges.push(e.id);
        if(e.n1!==e.n0) nodes[e.n1].edges.push(e.id);
        edges.push(e);
      }
    }

    const mj=layers.motorway_junction;
    if(mj) for(const f of mj.features){
      if(f.type!==1) continue;
      const p=f.props||{};
      if(!INSPECT.jsample) INSPECT.jsample=p;
      for(const line of f.geom) for(const [gx,gy] of line){
        const [la,lo]=tilePointToLL(tx,ty,tz,gx,gy,mj.extent);
        const [x,y]=toXY(la,lo);
        junctions.push({x,y,ref:String(p.ref||"").trim(),name:String(p.name||"").trim()});
      }
    }
  }

  const GRID=new Map(), GS=50;
  for(const e of edges){
    for(let i=1;i<e.pts.length;i++){
      const a=e.pts[i-1], b=e.pts[i];
      const i0=Math.floor(Math.min(a[0],b[0])/GS), i1=Math.floor(Math.max(a[0],b[0])/GS);
      const j0=Math.floor(Math.min(a[1],b[1])/GS), j1=Math.floor(Math.max(a[1],b[1])/GS);
      for(let ii=i0;ii<=i1;ii++) for(let jj=j0;jj<=j1;jj++){
        const k=ii+":"+jj;
        if(!GRID.has(k)) GRID.set(k,[]);
        GRID.get(k).push([e.id,i]);
      }
    }
  }
  return {edges,nodes,junctions,GRID,GS};
}

/* ==========================================================================
   6. Snapping
   ========================================================================== */
function snap(g,x,y,course,acc,prevSnap){
  const cands=[];
  for(const e of g.edges){
    let best=null;
    for(let i=1;i<e.pts.length;i++){
      const a=e.pts[i-1], b=e.pts[i];
      if(Math.min(a[0],b[0])-P.snapMaxDist>x || Math.max(a[0],b[0])+P.snapMaxDist<x) continue;
      if(Math.min(a[1],b[1])-P.snapMaxDist>y || Math.max(a[1],b[1])+P.snapMaxDist<y) continue;
      const pr=projToSeg(x,y,a[0],a[1],b[0],b[1]);
      if(!best||pr.d<best.d) best={...pr,i};
    }
    if(!best||best.d>P.snapMaxDist) continue;
    const a=e.pts[best.i-1], b=e.pts[best.i];
    const segB=brg(b[0]-a[0],b[1]-a[1]);
    let dir=1, bd;
    if(course==null){ bd=0; }
    else{
      const d0=absDiff(course,segB);
      if(e.oneway){ dir=1; bd=d0; }
      else if(d0<=90){ dir=1; bd=d0; }
      else { dir=-1; bd=180-d0; }
    }
    const tol=Math.max(P.onRoadOffset,(acc||10)*1.2);
    let cost = P.wOffset*best.d*(best.d>tol?2:1) + P.wBearing*bd;
    if(EXCLUDED.includes(e.cls)) cost += P.servicePenalty;
    if(prevSnap){
      if(prevSnap.edgeId===e.id) cost -= P.continuityBonus;
      else if(prevSnap.nodeSet && (prevSnap.nodeSet.has(e.n0)||prevSnap.nodeSet.has(e.n1))) cost -= P.connectedBonus;
    }
    cands.push({edge:e,edgeId:e.id,d:best.d,px:best.qx,py:best.qy,segIndex:best.i,
                t:best.t,segBearing:segB,dir,bearingDelta:bd,cost});
  }
  cands.sort((a,b)=>a.cost-b.cost);
  const s=cands[0]||null;
  if(s){
    s.nodeSet=new Set([s.edge.n0,s.edge.n1]);
    s.roadBearing = s.dir===1 ? s.segBearing : (s.segBearing+180)%360;
  }
  return {best:s, alternatives:cands.slice(1,4)};
}

/* ==========================================================================
   7. Forward chain
   ========================================================================== */
function buildChain(g,s){
  const pts=[[s.px,s.py]], meta=[], chainNodes=[];
  let station=0, edge=s.edge, dir=s.dir, guard=0;
  let idx = dir===1 ? s.segIndex : s.segIndex-1;
  const edgesUsed=[{edge,dir}], visited=new Set([edge.id]);

  while(guard++<200){
    if(dir===1){
      for(let i=idx;i<edge.pts.length;i++){
        const prev=pts[pts.length-1], p=edge.pts[i];
        station+=Math.hypot(p[0]-prev[0],p[1]-prev[1]);
        pts.push(p); meta.push(edge.id);
        if(station>P.chainMaxLen) return finish();
      }
    } else {
      for(let i=idx;i>=0;i--){
        const prev=pts[pts.length-1], p=edge.pts[i];
        station+=Math.hypot(p[0]-prev[0],p[1]-prev[1]);
        pts.push(p); meta.push(edge.id);
        if(station>P.chainMaxLen) return finish();
      }
    }
    if(pts.length<2) return finish();
    const endNode = dir===1 ? edge.n1 : edge.n0;
    const n=pts.length;
    const inB=brg(pts[n-1][0]-pts[n-2][0], pts[n-1][1]-pts[n-2][1]);

    let bestE=null,bestTurn=999,bestDir=1;
    const incident=[];
    for(const eid of g.nodes[endNode].edges){
      if(eid===edge.id) continue;
      const e2=g.edges[eid];
      let d2,outB;
      if(e2.n0===endNode){ d2=1; outB=brg(e2.pts[1][0]-e2.pts[0][0], e2.pts[1][1]-e2.pts[0][1]); }
      else { d2=-1; const L=e2.pts.length;
             outB=brg(e2.pts[L-2][0]-e2.pts[L-1][0], e2.pts[L-2][1]-e2.pts[L-1][1]); }
      const turn=absDiff(outB,inB);
      incident.push({edge:e2,dir:d2,turn,outB});
      if(turn<bestTurn && !visited.has(eid)){ bestTurn=turn; bestE=e2; bestDir=d2; }
    }
    chainNodes.push({node:endNode,station,inB,incident,
                     contEdgeId:(bestE&&bestTurn<=P.contAngle)?bestE.id:null});
    if(!bestE || bestTurn>P.contAngle) return finish();
    edge=bestE; dir=bestDir; visited.add(edge.id);
    edgesUsed.push({edge,dir});
    idx = dir===1 ? 1 : edge.pts.length-2;
  }
  return finish();

  function finish(){
    const cum=[0];
    for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
    return {pts,meta,cum,chainNodes,edgesUsed,length:cum[cum.length-1]||0};
  }
}
function chainBearingAt(chain,station){
  for(let i=1;i<chain.cum.length;i++){
    if(chain.cum[i]>=station){
      const a=chain.pts[i-1],b=chain.pts[i];
      return brg(b[0]-a[0],b[1]-a[1]);
    }
  }
  const n=chain.pts.length;
  if(n<2) return 0;
  return brg(chain.pts[n-1][0]-chain.pts[n-2][0], chain.pts[n-1][1]-chain.pts[n-2][1]);
}

/* ==========================================================================
   8. Candidates + reasons
   ========================================================================== */
function sameRoadway(a,b){
  const n=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(a.ref&&b.ref&&n(a.ref)===n(b.ref)) return true;
  if(a.name&&b.name&&n(a.name)===n(b.name)) return true;
  return false;
}
function collectCandidates(g,chain,s){
  const out=[];
  const chainEdgeIds=new Set(chain.edgesUsed.map(e=>e.edge.id));
  const contIds=new Set(chain.chainNodes.map(n=>n.contEdgeId).filter(Boolean));
  const chainNodeIds=new Set(chain.chainNodes.map(n=>n.node));

  for(const cn of chain.chainNodes){
    for(const inc of cn.incident){
      const e=inc.edge;
      out.push({src:"node",edge:e,edgeObj:e,name:e.name||e.ref,cls:e.cls,station:cn.station,
                turn:inc.turn,x:g.nodes[cn.node].x,y:g.nodes[cn.node].y,
                sharesNode:true,isCont:e.id===cn.contEdgeId});
    }
  }

  const tested=new Set();
  for(let i=1;i<chain.pts.length;i++){
    const a=chain.pts[i-1], b=chain.pts[i];
    const i0=Math.floor(Math.min(a[0],b[0])/g.GS), i1=Math.floor(Math.max(a[0],b[0])/g.GS);
    const j0=Math.floor(Math.min(a[1],b[1])/g.GS), j1=Math.floor(Math.max(a[1],b[1])/g.GS);
    for(let ii=i0;ii<=i1;ii++) for(let jj=j0;jj<=j1;jj++){
      const bucket=g.GRID.get(ii+":"+jj); if(!bucket) continue;
      for(const [eid,si] of bucket){
        if(chainEdgeIds.has(eid)) continue;
        const tk=eid+"@"+si+"#"+i; if(tested.has(tk)) continue; tested.add(tk);
        const e=g.edges[eid];
        const X=segCross(a,b,e.pts[si-1],e.pts[si]);
        if(!X) continue;
        const station=chain.cum[i-1]+Math.hypot(X.x-a[0],X.y-a[1]);
        out.push({src:"geom",edge:e,edgeObj:e,name:e.name||e.ref,cls:e.cls,station,
          turn:absDiff(brg(e.pts[si][0]-e.pts[si-1][0], e.pts[si][1]-e.pts[si-1][1]),
                       chainBearingAt(chain,station)),
          x:X.x,y:X.y,
          sharesNode:chainNodeIds.has(e.n0)||chainNodeIds.has(e.n1),
          isCont:contIds.has(e.id)});
      }
    }
  }

  out.sort((p,q)=>p.station-q.station);
  const merged=[];
  for(const c of out){
    if(!merged.some(m=>m.edge.id===c.edge.id && Math.abs(m.station-c.station)<P.dedupeStation)) merged.push(c);
  }

  const chainLayer=s.edge.layer;
  for(const c of merged){
    const e=c.edgeObj, turn=c.turn;
    if(c.station<=0.5)                            c.reason="behind vehicle";
    else if(c.isCont)                             c.reason="continuation of current roadway";
    else if(!c.name)                              c.reason="unnamed";
    else if(EXCLUDED.includes(c.cls))             c.reason="excluded class: "+c.cls;
    else if(turn<P.aliasAngle)                    c.reason="alias — parallel ("+turn.toFixed(0)+"°)";
    else if(Math.abs(180-turn)<P.aliasAngle)      c.reason="alias — antiparallel ("+turn.toFixed(0)+"°)";
    else if(!c.sharesNode && e.layer!==chainLayer) c.reason="grade separated (layer "+e.layer+" vs "+chainLayer+")";
    else if(!c.sharesNode && (e.structure==="bridge"||e.structure==="tunnel"))
                                                  c.reason="grade separated ("+e.structure+", no shared node)";
    else if(sameRoadway(e,s.edge))                c.reason="alias — shares name/ref with current roadway";
    else                                          c.reason=null;
  }
  return merged;
}

function collectExits(g,chain,s){
  const out=[];
  for(const cn of chain.chainNodes){
    for(const inc of cn.incident){
      const e=inc.edge;
      if(e.id===cn.contEdgeId) continue;
      const isLink=e.cls==="motorway_link";
      const leavesHere=e.n0===cn.node;
      let label="", jd=Infinity;
      for(const j of g.junctions){
        const d=Math.hypot(j.x-g.nodes[cn.node].x, j.y-g.nodes[cn.node].y);
        if(d<jd && d<=P.junctionRadius){
          jd=d;
          label = j.ref ? ("EXIT "+j.ref+(j.name?" • "+j.name:"")) : (j.name?("EXIT • "+j.name):"");
        }
      }
      const c={src:"node",edge:e,edgeObj:e,cls:e.cls,station:cn.station,
               x:g.nodes[cn.node].x,y:g.nodes[cn.node].y,turn:inc.turn,
               name: label || (e.name||e.ref||"RAMP"), junctionDist:jd};
      if(!isLink)             c.reason="not a motorway_link ("+e.cls+")";
      else if(!leavesHere)    c.reason="on-ramp — merges in, does not exit";
      else if(c.station<=0.5) c.reason="behind vehicle";
      else                    c.reason=null;
      out.push(c);
    }
  }
  out.sort((a,b)=>a.station-b.station);
  return out;
}

/* ==========================================================================
   9. Off-road state machine
   ========================================================================== */
const RS={state:"UNCERTAIN",good:0,bad:0};
function roadState(s,acc,speed){
  let good;
  if(!s) good=false;
  else{
    const offOK = s.d <= Math.max(P.onRoadOffset,(acc||10)*1.2);
    const brgOK = (speed==null||speed<P.minSpeedCourse) ? true : s.bearingDelta<=P.onRoadBearing;
    good = offOK && brgOK;
  }
  const definitelyBad = !s || s.d>P.offRoadOffset;
  if(good){ RS.good++; RS.bad=0; } else { RS.bad++; RS.good=0; }
  if(RS.good>=P.onRoadNeeded) RS.state="ON_ROAD";
  else if(RS.bad>=P.offRoadNeeded && definitelyBad) RS.state="OFF_ROAD";
  else if(RS.bad>=P.offRoadNeeded) RS.state="UNCERTAIN";
  else if(RS.state==="OFF_ROAD"&&RS.good>0) RS.state="UNCERTAIN";
  return RS.state;
}

/* ==========================================================================
   10. Shared engine — LIVE and REPLAY both call step()
   ========================================================================== */
const ENGINE={prevSnap:null,prevFixes:[]};
function deriveCourse(fix,prev){
  if(fix.heading!=null && !Number.isNaN(fix.heading) &&
     (fix.speed==null || fix.speed>P.minSpeedCourse)) return fix.heading;
  const [cx,cy]=toXY(fix.lat,fix.lon);
  for(let i=prev.length-1;i>=0;i--){
    const [px,py]=toXY(prev[i].lat,prev[i].lon);
    const dx=cx-px, dy=cy-py;
    if(Math.hypot(dx,dy)>12) return brg(dx,dy);
  }
  return null;
}
async function step(fix){
  if(!ORIGIN) setOrigin(fix.lat,fix.lon);
  const t0=performance.now();
  const course=deriveCourse(fix,ENGINE.prevFixes);
  ENGINE.prevFixes.push(fix); if(ENGINE.prevFixes.length>10) ENGINE.prevFixes.shift();

  const g=await ensureGraph(fix.lat,fix.lon,false);
  const [x,y]=toXY(fix.lat,fix.lon);
  const sn=snap(g,x,y,course,fix.acc,ENGINE.prevSnap);
  const s=sn.best;
  const state=roadState(s,fix.acc,fix.speed);

  const D={fix,course,x,y,state,snap:s,alts:sn.alternatives,graph:g,
           chain:null,candidates:[],selected:null,hwy:false,ms:0};

  if(s && state!=="OFF_ROAD"){
    ENGINE.prevSnap=s;
    D.hwy = (s.edge.cls==="motorway");
    D.chain=buildChain(g,s);
    D.candidates = D.hwy ? collectExits(g,D.chain,s) : collectCandidates(g,D.chain,s);
    D.selected = D.candidates.find(c=>c.reason===null) || null;
  }
  D.ms=performance.now()-t0;
  return D;
}

/* ==========================================================================
   11. Recording / export / replay
   ========================================================================== */
const REC={fixes:[],startedAt:0};
let MODE="IDLE", watchId=null;
const REPLAY={fixes:[],i:0,playing:false,loaded:""};

function recordFix(c,t){
  REC.fixes.push({t:t||Date.now(),lat:c.latitude,lon:c.longitude,acc:c.accuracy,
    heading:(c.heading!=null&&!Number.isNaN(c.heading))?c.heading:null,
    speed:(c.speed!=null&&!Number.isNaN(c.speed))?c.speed:null});
}
function exportDrive(){
  if(!REC.fixes.length){ alert("No fixes recorded yet."); return; }
  const blob=new Blob([JSON.stringify({
    format:"f1rsthud-ahead-lab-trace", version:1, app:"AheadLab 0.1.1",
    startedAt:REC.startedAt, exportedAt:Date.now(),
    params:P, excluded:EXCLUDED, fixCount:REC.fixes.length,
    counters:{...CTR}, fixes:REC.fixes
  },null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="aheadlab_drive_"+new Date().toISOString().replace(/[:.]/g,"-")+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function loadTrace(text,fname){
  let j; try{ j=JSON.parse(text); }catch(e){ alert("Not valid JSON"); return; }
  const fixes=Array.isArray(j)?j:j.fixes;
  if(!Array.isArray(fixes)||!fixes.length){ alert("No fixes in file"); return; }
  stopLive();
  REPLAY.fixes=fixes; REPLAY.i=0; REPLAY.playing=false; REPLAY.loaded=fname||"trace";
  MODE="REPLAY";
  ENGINE.prevSnap=null; ENGINE.prevFixes=[]; ORIGIN=null; GRAPH=null; GRAPH_KEY="";
  RS.state="UNCERTAIN"; RS.good=0; RS.bad=0;
  log("loaded "+fixes.length+" fixes from "+REPLAY.loaded);
  replayStep();
}
let busy=false;
async function runFix(f){
  if(busy) return; busy=true;
  try{ render(await step(f)); }
  catch(e){ log("engine error: "+e.message); console.error(e); }
  finally{ busy=false; }
}
async function replayStep(){
  if(REPLAY.i>=REPLAY.fixes.length){ REPLAY.playing=false; syncBtns(); return; }
  await runFix(REPLAY.fixes[REPLAY.i++]);
}
async function replayLoop(){
  while(REPLAY.playing && REPLAY.i<REPLAY.fixes.length){
    const a=REPLAY.fixes[REPLAY.i], b=REPLAY.fixes[REPLAY.i+1];
    await replayStep();
    const mult=+document.getElementById("speed").value;
    if(mult>0 && a && b){
      const dt=Math.min(2000,Math.max(0,(b.t-a.t)/mult));
      await new Promise(r=>setTimeout(r,dt));
    } else await new Promise(r=>setTimeout(r,0));
  }
  REPLAY.playing=false; syncBtns();
}
function startLive(){
  const tok=document.getElementById("token").value.trim();
  if(!tok.startsWith("pk.")){ alert("Enter your pk. Mapbox public token first."); return; }
  localStorage.setItem("mapbox_public_token",tok);
  if(!navigator.geolocation){ alert("No geolocation"); return; }
  if(!window.isSecureContext){ alert("Must be served over HTTPS"); return; }
  MODE="LIVE"; REC.fixes=[]; REC.startedAt=Date.now(); CTR.startedAt=Date.now();
  ENGINE.prevSnap=null; ENGINE.prevFixes=[]; ORIGIN=null; GRAPH=null; GRAPH_KEY="";
  RS.state="UNCERTAIN"; RS.good=0; RS.bad=0; LOGGED_LAYERS=false;
  if("wakeLock" in navigator) navigator.wakeLock.request("screen").catch(()=>{});
  watchId=navigator.geolocation.watchPosition(pos=>{
    recordFix(pos.coords,Date.now());
    runFix(REC.fixes[REC.fixes.length-1]);
  },err=>log("GPS error "+err.code+": "+err.message),
    {enableHighAccuracy:true,maximumAge:1000,timeout:15000});
  log("LIVE started"); syncBtns();
}
function stopLive(){
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; log("LIVE stopped"); }
  if(MODE==="LIVE") MODE="IDLE";
  syncBtns();
}

/* ==========================================================================
   12. Rendering
   ========================================================================== */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let HEADING_UP=false;
function fitCanvas(){
  const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",fitCanvas); fitCanvas();

const CLSCOLOR={motorway:"#e0b155",motorway_link:"#c98f3a",trunk:"#d09a4a",primary:"#7fa7d8",
  secondary:"#6f93bd",tertiary:"#5f7f9f",street:"#4d5f70",street_limited:"#465666",
  service:"#33383f",driveway:"#2c3037",parking_aisle:"#2c3037",path:"#2a2f2a",track:"#2a2f2a"};

function render(D){
  const rate = CTR.startedAt ? (CTR.net/Math.max(1,(Date.now()-CTR.startedAt)/60000)) : 0;
  const s=D.snap, sel=D.selected;
  const kv=[
    ["MODE", MODE + (MODE==="REPLAY" ? `  (${REPLAY.i}/${REPLAY.fixes.length})` : "")],
    ["ROAD STATE", `<span class="${D.state==="ON_ROAD"?"ok":D.state==="OFF_ROAD"?"bad":"warnc"}">${D.state}</span>`],
    ["SNAPPED ROAD", s ? (s.edge.name || s.edge.ref || "<unnamed>") : "<span class='bad'>none</span>"],
    ["ROAD CLASS", s ? `${s.edge.cls}${s.edge.type&&s.edge.type!==s.edge.cls?" / "+s.edge.type:""}${s.edge.oneway?" · oneway":""}${s.edge.structure!=="none"?" · "+s.edge.structure:""} · layer ${s.edge.layer}` : "—"],
    ["OFFSET", s ? s.d.toFixed(1)+" m" : "—"],
    ["COURSE", D.course==null ? "—" : Math.round(D.course)+"°"],
    ["ROAD BEARING", s ? Math.round(s.roadBearing)+"°" : "—"],
    ["BEARING DELTA", s ? s.bearingDelta.toFixed(1)+"°" : "—"],
    ["MODE (SURFACE)", D.hwy ? "HIGHWAY — next exit" : "SURFACE — next intersection"],
    ["NEXT", sel ? `<b class="ok">${sel.name}</b>` : "<span class='bad'>—</span>"],
    ["ALONG-ROAD DIST", sel ? Math.round(sel.station)+" m  ("+Math.round(sel.station*3.28084)+" ft)" : "—"],
    ["CHAIN LENGTH", D.chain ? Math.round(D.chain.length)+" m over "+D.chain.edgesUsed.length+" segments" : "—"],
    ["CANDIDATES", D.candidates.length + " found, " + D.candidates.filter(c=>!c.reason).length + " eligible"],
    ["TILES LOADED", TILES.size + " cached / " + CTR.tile + " fetched · " + Math.round(CTR.bytes/1024) + " KB"],
    ["NEW TILE REQUESTS", String(CTR.miss)],
    ["CACHE HIT / MISS", CTR.hit + " / " + CTR.miss + (CTR.fail?`  <span class="bad">${CTR.fail} failed</span>`:"")],
    ["NETWORK REQUESTS", CTR.net + `  <span class="dim">(${rate.toFixed(1)}/min)</span>`],
    ["GRAPH", D.graph ? `${D.graph.edges.length} edges · ${D.graph.nodes.length} nodes · ${D.graph.junctions.length} junctions` : "—"],
    ["GPS", `±${(D.fix.acc||0).toFixed(0)} m · ${D.fix.speed==null?"—":(D.fix.speed*2.23694).toFixed(0)+" mph"}`],
    ["ENGINE TIME", D.ms.toFixed(0)+" ms"],
    ["REASON", s ? `snap cost ${s.cost.toFixed(1)}${D.alts.length?" · next best "+(D.alts[0].edge.name||D.alts[0].edge.cls)+" @"+D.alts[0].d.toFixed(0)+"m cost "+D.alts[0].cost.toFixed(1):""}` : "no edge within "+P.snapMaxDist+" m"]
  ];
  document.getElementById("kv").innerHTML =
    kv.map(([k,v])=>`<div class="k">${k}</div><div>${v}</div>`).join("");

  const rows=["<tr><th>#</th><th>station</th><th>name</th><th>class</th><th>turn</th><th>verdict</th></tr>"];
  D.candidates.slice(0,18).forEach((c,i)=>{
    const ok=!c.reason;
    rows.push(`<tr><td class="dim">${c.src==="geom"?"g":"n"}${i}</td>
      <td>${Math.round(c.station)}m</td>
      <td class="${ok?"ok":""}">${c.name||"<i class='dim'>unnamed</i>"}</td>
      <td class="dim">${c.cls}</td>
      <td class="dim">${c.turn==null?"—":Math.round(c.turn)+"°"}</td>
      <td class="${ok?"ok":"bad"}">${ok?"SELECTED":c.reason}</td></tr>`);
  });
  if(!D.candidates.length) rows.push(`<tr><td colspan="6" class="bad">no candidates — check snap and chain on the canvas</td></tr>`);
  document.querySelector("#cands tbody").innerHTML=rows.join("");

  drawCanvas(D);
  updateInspector();
}

function drawCanvas(D){
  const w=cv.clientWidth, h=cv.clientHeight;
  ctx.clearRect(0,0,w,h);
  if(!D.graph||!ORIGIN) return;
  const cx=w/2, cy=h/2, scale=Math.min(w,h)/(2*P.canvasRange);
  const rot = HEADING_UP && D.course!=null ? -D.course*Math.PI/180 : 0;
  const cosR=Math.cos(rot), sinR=Math.sin(rot);
  const T=(x,y)=>{ const dx=(x-D.x)*scale, dy=(y-D.y)*scale;
                   return [cx + dx*cosR - dy*sinR, cy - (dx*sinR + dy*cosR)]; };

  for(const e of D.graph.edges){
    if(Math.hypot(e.pts[0][0]-D.x,e.pts[0][1]-D.y)>P.canvasRange*2 &&
       Math.hypot(e.pts[e.pts.length-1][0]-D.x,e.pts[e.pts.length-1][1]-D.y)>P.canvasRange*2) continue;
    ctx.beginPath();
    e.pts.forEach((p,i)=>{ const [X,Y]=T(p[0],p[1]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
    ctx.strokeStyle=CLSCOLOR[e.cls]||"#3a4048";
    ctx.lineWidth=(e.cls==="motorway"?2.5:e.cls==="motorway_link"?2:1.2);
    ctx.stroke();
  }
  if(D.chain&&D.chain.pts.length>1){
    ctx.beginPath();
    D.chain.pts.forEach((p,i)=>{ const [X,Y]=T(p[0],p[1]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
    ctx.strokeStyle="#3ad07a"; ctx.lineWidth=3.5; ctx.globalAlpha=.85; ctx.stroke(); ctx.globalAlpha=1;
  }
  if(D.snap){
    const e=D.snap.edge;
    ctx.beginPath();
    e.pts.forEach((p,i)=>{ const [X,Y]=T(p[0],p[1]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
    ctx.strokeStyle="#8fd6ff"; ctx.lineWidth=2; ctx.stroke();
    const [SX,SY]=T(D.snap.px,D.snap.py);
    ctx.beginPath(); ctx.arc(SX,SY,3.5,0,7); ctx.fillStyle="#8fd6ff"; ctx.fill();
  }
  for(const c of D.candidates.slice(0,18)){
    if(c.x==null) continue;
    const [X,Y]=T(c.x,c.y);
    const ok=!c.reason;
    ctx.beginPath(); ctx.arc(X,Y,ok?7:4,0,7);
    ctx.fillStyle= ok?"#3ad07a":"#8a3f3f"; ctx.fill();
    if(ok){ ctx.font="600 11px ui-monospace,monospace"; ctx.fillStyle="#cfeedd"; ctx.fillText(c.name,X+10,Y+4); }
  }
  for(const j of D.graph.junctions){
    if(Math.hypot(j.x-D.x,j.y-D.y)>P.canvasRange*1.6) continue;
    const [X,Y]=T(j.x,j.y);
    ctx.beginPath(); ctx.arc(X,Y,3,0,7); ctx.strokeStyle="#e0b155"; ctx.lineWidth=1.2; ctx.stroke();
  }
  const [VX,VY]=T(D.x,D.y);
  ctx.beginPath(); ctx.arc(VX,VY,5,0,7);
  ctx.fillStyle= D.state==="ON_ROAD"?"#fff":D.state==="OFF_ROAD"?"#e2706e":"#e0b155"; ctx.fill();
  if(D.course!=null){
    const a=(D.course*Math.PI/180)+rot;
    ctx.beginPath(); ctx.moveTo(VX,VY); ctx.lineTo(VX+Math.sin(a)*26, VY-Math.cos(a)*26);
    ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke();
  }
  ctx.font="11px ui-monospace,monospace"; ctx.fillStyle="#6a6a74";
  ctx.fillText((HEADING_UP?"HEADING-UP":"NORTH-UP")+"  ±"+P.canvasRange+" m",8,14);
  if(!HEADING_UP){
    ctx.fillStyle="#8a8a94"; ctx.fillText("N",w-16,16);
    ctx.beginPath(); ctx.moveTo(w-12,20); ctx.lineTo(w-12,34);
    ctx.strokeStyle="#8a8a94"; ctx.lineWidth=1; ctx.stroke();
  }
}

function updateInspector(){
  const fmt=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,26)
    .map(([k,v])=>`  ${String(k).padEnd(20)} ${v}`).join("\n") || "  (none)";
  document.getElementById("inspect").textContent =
    "layers present:\n"+fmt(INSPECT.layers)+
    "\n\nroad.class:\n"+fmt(INSPECT.cls)+
    "\n\nroad.type:\n"+fmt(INSPECT.type)+
    "\n\nroad.structure:\n"+fmt(INSPECT.structure)+
    "\n\nroad.layer:\n"+fmt(INSPECT.layer)+
    "\n\nroad.oneway:\n"+fmt(INSPECT.oneway)+
    "\n\nsample road feature properties:\n"+JSON.stringify(INSPECT.sample||{},null,1)+
    "\n\nsample motorway_junction properties:\n"+JSON.stringify(INSPECT.jsample||{},null,1);
}

const LOG=[];
function log(m){
  LOG.unshift(new Date().toLocaleTimeString()+"  "+m);
  if(LOG.length>80) LOG.pop();
  const el=document.getElementById("log");
  if(el) el.textContent=LOG.join("\n");
}

/* ==========================================================================
   13. Parameter UI + wiring
   ========================================================================== */
function buildParams(){
  const host=document.getElementById("params");
  host.innerHTML="";
  for(const k of Object.keys(DEFAULTS)){
    const lab=document.createElement("label"); lab.textContent=k;
    const inp=document.createElement("input");
    inp.type="number"; inp.step="any"; inp.value=P[k];
    inp.oninput=()=>{ const v=parseFloat(inp.value);
      if(Number.isFinite(v)){ P[k]=v; if(k==="zoom"||k==="stitchTol") GRAPH_KEY=""; } };
    host.appendChild(lab); host.appendChild(inp);
  }
  const l2=document.createElement("label"); l2.textContent="excluded classes";
  const i2=document.createElement("input"); i2.type="text"; i2.value=EXCLUDED.join(",");
  i2.oninput=()=>{ EXCLUDED=i2.value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean); };
  host.appendChild(l2); host.appendChild(i2);
}
buildParams();

const saved=localStorage.getItem("mapbox_public_token");
if(saved) document.getElementById("token").value=saved;

document.getElementById("btnLive").onclick=startLive;
document.getElementById("btnStop").onclick=stopLive;
document.getElementById("btnExport").onclick=exportDrive;
document.getElementById("btnLoadProxy").onclick=()=>document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>loadTrace(r.result,f.name); r.readAsText(f);
};
document.getElementById("btnPlay").onclick=()=>{
  if(MODE!=="REPLAY"){ alert("Load a trace first."); return; }
  REPLAY.playing=!REPLAY.playing; syncBtns();
  if(REPLAY.playing) replayLoop();
};
document.getElementById("btnStep").onclick=()=>{ if(MODE==="REPLAY"){ REPLAY.playing=false; syncBtns(); replayStep(); } };
document.getElementById("btnRestart").onclick=()=>{
  if(MODE!=="REPLAY") return;
  REPLAY.i=0; REPLAY.playing=false;
  ENGINE.prevSnap=null; ENGINE.prevFixes=[]; RS.state="UNCERTAIN"; RS.good=0; RS.bad=0;
  syncBtns(); replayStep();
};
document.getElementById("btnOrient").onclick=e=>{
  HEADING_UP=!HEADING_UP;
  e.target.textContent=HEADING_UP?"HEADING-UP":"NORTH-UP";
  e.target.classList.toggle("on",HEADING_UP);
};
document.getElementById("btnSelfTest").onclick=()=>{
  const r=selfTestDecoder();
  log("DECODER SELF-TEST: "+r);
  alert("Decoder self-test: "+r);
};
document.getElementById("btnResetP").onclick=()=>{ P=Object.assign({},DEFAULTS); GRAPH_KEY=""; buildParams(); log("params reset"); };
document.getElementById("btnRebuild").onclick=()=>{ GRAPH_KEY=""; TILES.clear(); LOGGED_LAYERS=false; log("cache cleared; graph rebuilds on next fix"); };

function syncBtns(){
  document.getElementById("btnLive").classList.toggle("on",MODE==="LIVE");
  document.getElementById("btnPlay").textContent=REPLAY.playing?"PAUSE":"PLAY";
  document.getElementById("btnPlay").classList.toggle("on",REPLAY.playing);
}
log("Ahead Lab 0.1.1 ready — MVT decoder fixed. Run SELF-TEST DECODER first.");
